name: CI

# NOT on push to main, deliberately.
#
# Render deploys purifyapp.net from main on its own and does not need this
# workflow to have run. Leaving the push trigger on meant every deploy also
# bought a CI run, which is billed, and which the owner has asked three times
# not to fire. Verification happens locally before the push instead:
# npm run typecheck, npm run test:unit, npm run lint, and the two native
# exports when app pages changed.
#
# The pull_request trigger stays, so opening a PR against main is still the way
# to get a checked merge when one is wanted. That is now an opt in rather than
# the price of shipping.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public-domain Scripture renders without these. The licensed-Bible code
      # path (lib/bible/api-bible.ts) returns null cleanly when env is absent,
      # so CI exercises the PD reader without needing publisher keys.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # Skip Husky / any postinstall scripts that would break on CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # lib/content uses node:sqlite (Node >= 22.5); Node 20 aborted the
          # unit step for every run since it landed, silently disabling the
          # build/e2e/axe/Lighthouse gates downstream. 24 matches the only
          # environment the suite is verified on.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # The browser gates run on the pull request only. `push: main` is kept as
      # the net for a local merge that skipped a PR (see AGENTS.md), but that
      # net only needs to catch a broken tree, and lint/typecheck/unit/build
      # above already do. Re-running Playwright and Lighthouse on the merge
      # commit re-proves what the PR just proved, at roughly half the job's
      # total minutes. Every change still gets one full browser pass.
      - name: Install Playwright browsers
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite + axe
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Run Lighthouse CI
        if: github.event_name == 'pull_request'
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
