name: iOS build (signed)

# Signed, uploadable iOS build. Replaces the old unsigned ios-ipa.yml, which
# produced something nobody could install: it targeted macos-14 (Xcode 15, below
# Capacitor 8's floor), ran a bare `cap sync ios` with no web build, so the app
# was a remote wrapper around purifyapp.net (the textbook App Store 4.2
# rejection), hand-zipped a Payload that needed AltStore to sideload, and
# stripped CODE_SIGN_ENTITLEMENTS so it could not exercise push at all.
#
# This builds the same local-first bundle Android ships, signs it with the
# distribution certificate, and uploads it to App Store Connect for TestFlight.
#
# ── Secrets this needs (Settings > Secrets and variables > Actions) ──────────
#
#   APPLE_TEAM_ID                     Membership details on developer.apple.com.
#                                     Not really a secret; a secret only so it
#                                     is entered once, next to the others.
#   IOS_DIST_CERT_P12_BASE64          Apple Distribution certificate + key, as a
#                                     base64 .p12. See docs/IOS_BUILD_SETUP.md
#                                     for generating the CSR without a Mac.
#   IOS_DIST_CERT_PASSWORD            The password chosen when exporting it.
#   APPSTORE_API_KEY_ID               App Store Connect > Users and Access >
#   APPSTORE_API_ISSUER_ID            Integrations > App Store Connect API.
#   APPSTORE_API_PRIVATE_KEY_BASE64   The AuthKey_XXXX.p8, base64. Downloadable
#                                     ONCE; if lost, revoke and make a new key.
#   NEXT_PUBLIC_REVENUECAT_IOS_KEY    RevenueCat > iOS app > public SDK key.
#   NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID  Google Cloud > Credentials > iOS client.
#   GOOGLE_REVERSED_CLIENT_ID         The same id reversed, for the callback URL
#                                     scheme in Info.plist.
#
# An App Store Connect API key is used rather than an Apple ID plus
# app-specific password because the latter is 2FA-fragile, ties CI to a person,
# and cannot create or update provisioning profiles, which -allowProvisioningUpdates
# needs to do every time the app's capabilities change.

on:
  workflow_dispatch:
    inputs:
      local_first:
        description: "Bundle the local-first offline build (out/). Leave checked. Unchecking produces the remote-wrapper shape the App Store rejects under 4.2."
        type: boolean
        default: true
      upload:
        description: "Upload to App Store Connect (TestFlight). Uncheck to build and sign without delivering."
        type: boolean
        default: true
      build_number:
        description: "Override CFBundleVersion. Leave empty to use the workflow run number. Only needed to recover from a duplicate-build-number rejection."
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    # Capacitor 8 requires Xcode 16+, so macos-14 (Xcode 15) cannot build this
    # at all. The Xcode step below prints what the runner actually has rather
    # than assuming a path, because that is the single most likely thing to
    # need adjusting on the first run.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails BEFORE the 40-minute build rather than at App Store review.
      # Purify offers Google sign-in, so guideline 4.8 requires an equivalent
      # private login, and the Apple button is gated off by default because it
      # depends on a Supabase provider this repo cannot see. Shipping the iOS
      # binary with the gate closed means submitting an app that fails 4.8.
      - name: Refuse to build without Sign in with Apple
        run: |
          if [ "${{ secrets.NEXT_PUBLIC_APPLE_SIGNIN_ENABLED }}" != "1" ]; then
            echo "::error::NEXT_PUBLIC_APPLE_SIGNIN_ENABLED is not \"1\". Configure the Supabase Apple provider first (Client IDs must hold the Services ID AND the bundle id net.purifyapp.purify, plus a valid secret key, and the provider must be enabled), then set this secret. See docs/IOS_BUILD_SETUP.md."
            exit 1
          fi

      - name: Show the toolchain
        run: |
          set -euo pipefail
          echo "Xcodes available on this runner:"
          ls -d /Applications/Xcode*.app || true

          # NEVER pipe xcodebuild or swift straight into head. `head` closes the
          # pipe after the first line, the tool keeps writing, and because these
          # are Objective-C tools an EPIPE surfaces as an UNCAUGHT
          # NSFileHandleOperationException ("Broken pipe") that aborts the
          # process with a nonzero status instead of exiting quietly. Under
          # `set -o pipefail` that kills the step, and it is a RACE: the first
          # run of this workflow survived it and the second did not, which makes
          # it look like a flaky runner rather than a bug in this file.
          #
          # Capture the whole output first, then parse the string. `head` then
          # reads from a here-string with no live writer to signal.
          XCODEBUILD_VERSION="$(xcodebuild -version)"
          echo "$XCODEBUILD_VERSION"
          swift --version || true

          # Capacitor 8 needs 16+. Fail loudly here rather than 40 minutes
          # later inside a Swift compile with a confusing error.
          MAJOR="$(printf '%s\n' "$XCODEBUILD_VERSION" | sed -n '1s/Xcode \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$MAJOR" ]; then
            echo "::error::Could not parse an Xcode version from: $XCODEBUILD_VERSION"
            exit 1
          fi
          echo "Xcode major version: $MAJOR"
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode $MAJOR is below Capacitor 8's minimum of 16. Pick a newer runner image or xcode-select a newer Xcode."
            exit 1
          fi

      # The same static export Android bundles. NEXT_PUBLIC_* are public values
      # (already baked into the deployed web bundle) but must be present AT
      # BUILD TIME, because Next inlines them: a value set later on Render never
      # reaches an app that was already compiled.
      - name: Build local-first web bundle
        if: ${{ inputs.local_first }}
        run: npm run build:ios
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PLUS_ENFORCED_NATIVE: ${{ secrets.NEXT_PUBLIC_PLUS_ENFORCED_NATIVE }}
          NEXT_PUBLIC_CAMPAIGNS_ENABLED: ${{ secrets.NEXT_PUBLIC_CAMPAIGNS_ENABLED }}
          NEXT_PUBLIC_EIKON_BOX_ENABLED: ${{ secrets.NEXT_PUBLIC_EIKON_BOX_ENABLED }}
          # NEXT_PUBLIC_VAPID_KEY and NEXT_PUBLIC_API_BIBLE_KEY are deliberately
          # NOT here. Both look like they belong and neither reaches anything:
          #   - VAPID is read only by lib/push/client.ts, the Web Push path.
          #     lib/push/reminders.ts branches on isNativeClient() and sends the
          #     native shells to APNs/FCM instead, so that path is unreachable
          #     in this bundle.
          #   - API_BIBLE_KEY is read only by app/api/admin/health, and
          #     scripts/native-build.mjs stashes app/api out of the export.
          # Both still matter on the website, where they are Render env, not
          # Actions secrets. Listing them here only lengthens the list of
          # secrets someone thinks they have to set before iOS can build.
          NEXT_PUBLIC_SHOP_ENABLED: "1"
          NEXT_PUBLIC_COMMUNITY_ENABLED: "1"
          # iOS-specific. The StoreKit key is a DIFFERENT RevenueCat app from
          # Android's; billingAvailable() gates on the key for this platform, so
          # if it is unset the paywall renders its "unavailable" state rather
          # than a purchase button that fails at the sheet. That is the correct
          # shape for a build whose products are not live yet, but it means
          # Purify Plus is unbuyable in that build: do not claim otherwise in
          # the patch notes.
          NEXT_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_KEY }}
          # Google's native picker on iOS runs with the iOS client id, and the
          # token it mints carries that id as its audience. The same id must be
          # on Supabase's Google provider authorised list or every iPhone
          # sign-in fails with "Unacceptable audience in id_token".
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          # Must be "1" here, and the step below refuses the build otherwise.
          # An iOS binary that offers Google without Sign in with Apple is a
          # guideline 4.8 rejection, and the flag is only safe to set once the
          # Supabase Apple provider is genuinely live, so this doubles as the
          # check that it is.
          NEXT_PUBLIC_APPLE_SIGNIN_ENABLED: ${{ secrets.NEXT_PUBLIC_APPLE_SIGNIN_ENABLED }}

      # CAP_LOCAL=1 makes capacitor.config.ts use webDir=out (the bundled UI)
      # instead of the remote server.url.
      - name: Sync Capacitor into the iOS project
        run: npx cap sync ios
        env:
          CAP_LOCAL: ${{ inputs.local_first && '1' || '' }}

      # Package.swift is generated by the sync above and deliberately untracked
      # (see ios/.gitignore for the full reasoning). The Capacitor CLI builds
      # its dependency paths with path.relative(), which emits BACKSLASHES when
      # the sync runs on Windows; those are invalid escape sequences inside
      # Swift string literals, and the committed file sat unparseable for 432
      # commits without anyone noticing, because nothing ever tried to build it.
      #
      # This is the check that makes that impossible to repeat.
      - name: Verify the generated Swift package
        run: |
          set -euo pipefail
          PKG=ios/App/CapApp-SPM/Package.swift
          test -f "$PKG" || { echo "::error::$PKG was not generated by cap sync."; exit 1; }
          if grep -q '\\' "$PKG"; then
            echo "::error::$PKG contains a backslash, so it was generated on Windows and will not parse."
            grep -n '\\' "$PKG" || true
            exit 1
          fi
          COUNT="$(grep -c '\.package(' "$PKG" || true)"
          echo "Swift package declares $COUNT dependencies."
          # 15 Capacitor plugins in package.json + capacitor-swift-pm itself.
          if [ "$COUNT" -lt 16 ]; then
            echo "::error::Only $COUNT package dependencies; expected at least 16. A plugin failed to sync, and whatever it powers will be silently dead in the build."
            cat "$PKG"
            exit 1
          fi

      # `security import` answers EVERY failure with "The user name or passphrase
      # you entered is not correct": a wrong password, a truncated secret, and a
      # bundle whose ciphers it does not implement are indistinguishable. Runs #1
      # and #3 were both spent on that one sentence.
      #
      # The format half of that is real and version-dependent. Apple's DTS has
      # confirmed macOS 15 was updated to read modern PKCS#12 crypto (AES-256-CBC
      # with PBKDF2, SHA-256 MAC) where macOS 14 could only read the legacy
      # shape. Going the other way, RC2-40-CBC, which is exactly what OpenSSL 3's
      # `-legacy` export writes for the certificate bag, is deprecated and gets
      # refused by newer Security framework builds. So the advice that produced
      # this repository's .p12 was correct for macOS 14 and wrong for the
      # macos-15 runner, and neither the old step nor its error message could
      # say so.
      #
      # This step therefore stops guessing: openssl decides whether the password
      # is right (it distinguishes the cases that `security` conflates), and the
      # bundle is re-wrapped into each shape and imported until one is accepted,
      # printing which one worked.
      - name: Import the signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$CERT_B64" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 is not set. See docs/IOS_BUILD_SETUP.md."
            exit 1
          fi
          # Checked separately because an unset password fails identically to a
          # wrong one, and the old step did not look.
          if [ -z "$CERT_PASSWORD" ]; then
            echo "::error::IOS_DIST_CERT_PASSWORD is not set. See docs/IOS_BUILD_SETUP.md."
            exit 1
          fi

          P12="$RUNNER_TEMP/dist.p12"
          # Whitespace is stripped first: a base64 secret pasted through a
          # browser can arrive with newlines or a stray CR, and BSD base64
          # rejects what GNU base64 tolerates.
          if ! printf '%s' "$CERT_B64" | tr -d '[:space:]' | base64 -d > "$P12"; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 is not valid base64."
            exit 1
          fi
          SIZE="$(wc -c < "$P12" | tr -d ' ')"
          echo "Decoded $SIZE bytes of PKCS#12."
          if [ "$SIZE" -lt 512 ]; then
            echo "::error::That is too small to be a certificate bundle; the secret was truncated when it was pasted."
            exit 1
          fi

          # The two openssls on a macOS runner have complementary blind spots,
          # and which one can read this bundle depends on how it was exported:
          # LibreSSL at /usr/bin/openssl still implements RC2 natively, while
          # OpenSSL 3 needs -legacy for it but is the one that writes the modern
          # shape. Assuming either would be the same kind of guess that produced
          # the certificate in the first place, so every combination is tried.
          PEM="$RUNNER_TEMP/bundle.pem"
          MODERN="$RUNNER_TEMP/modern.p12"
          LEGACY="$RUNNER_TEMP/legacy.p12"

          OSSL3=""
          BREW_SSL="$(brew --prefix openssl@3 2>/dev/null || true)"
          # An empty prefix would otherwise synthesise the path "/bin/openssl".
          [ -n "$BREW_SSL" ] && BREW_SSL="$BREW_SSL/bin/openssl"
          for c in "$BREW_SSL" /opt/homebrew/bin/openssl /usr/local/bin/openssl; do
            if [ -n "$c" ] && [ -x "$c" ] && "$c" version 2>/dev/null | grep -q '^OpenSSL 3'; then
              OSSL3="$c"
              break
            fi
          done
          echo "System openssl: $(/usr/bin/openssl version)"
          echo "OpenSSL 3 binary: ${OSSL3:-none found}"

          # Two password candidates are tried, in this order. The second exists
          # because the certificate this repository shipped was exported with a
          # password carrying a stray trailing carriage return, and every
          # human-readable copy of that password drops it: it is invisible in a
          # text file, in a terminal, and in the GitHub secret form. `security`
          # reported that for three runs as "the user name or passphrase you
          # entered is not correct", which was true and unactionable.
          export PW_PLAIN="$CERT_PASSWORD"
          export PW_CR="$CERT_PASSWORD$(printf '\r')"

          # $1 binary, $2 extra flag ("" or -legacy), $3 name of the password
          # variable. Writes the decrypted bundle to $PEM, so it doubles as the
          # password check: this is the command that says specifically which of
          # the two things is wrong, where `security` conflates them.
          try_read() {
            local bin="$1" flag="$2" pwvar="$3"
            [ -x "$bin" ] || return 1
            if [ -n "$flag" ]; then
              "$bin" pkcs12 "$flag" -in "$P12" -passin "env:$pwvar" \
                -nodes -out "$PEM" 2>> "$RUNNER_TEMP/p12.err"
            else
              "$bin" pkcs12 -in "$P12" -passin "env:$pwvar" \
                -nodes -out "$PEM" 2>> "$RUNNER_TEMP/p12.err"
            fi
          }

          : > "$RUNNER_TEMP/p12.err"
          READ_WITH=""
          PWVAR=""
          for pwv in PW_PLAIN PW_CR; do
            if try_read /usr/bin/openssl "" "$pwv"; then
              READ_WITH="the system openssl"
            elif [ -n "$OSSL3" ] && try_read "$OSSL3" -legacy "$pwv"; then
              READ_WITH="OpenSSL 3 with -legacy"
            elif [ -n "$OSSL3" ] && try_read "$OSSL3" "" "$pwv"; then
              READ_WITH="OpenSSL 3"
            fi
            if [ -n "$READ_WITH" ]; then
              PWVAR="$pwv"
              break
            fi
          done

          if [ -z "$PWVAR" ]; then
            echo "--- what openssl said ---"
            cat "$RUNNER_TEMP/p12.err"
            # "mac verify failure" means the file parsed and the password did
            # not fit. Anything else means the bytes are not a bundle at all.
            if grep -qi 'mac verify' "$RUNNER_TEMP/p12.err"; then
              echo "::error::The bundle is intact but IOS_DIST_CERT_PASSWORD does not open it. Re-paste that secret using the password chosen when the .p12 was exported."
            else
              echo "::error::The decoded bytes are not a readable PKCS#12 bundle. Re-paste IOS_DIST_CERT_P12_BASE64; a truncated paste looks exactly like this."
            fi
            exit 1
          fi

          PW="${!PWVAR}"
          export PW
          echo "Opened the bundle with $READ_WITH."
          if [ "$PWVAR" = "PW_CR" ]; then
            echo "::warning::This certificate only opens when a trailing carriage return is appended to IOS_DIST_CERT_PASSWORD, so the stored password does not really match the stored bundle. The build continues, but replace both secrets with the clean pair described in docs/IOS_BUILD_SETUP.md."
          fi

          KEYCHAIN="$RUNNER_TEMP/purify-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default is a 5-minute auto-lock, which is shorter than this build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # The .p12 holds the leaf only, so the chain needs Apple's G3
          # intermediate to build. `find-identity -v` lists nothing without it,
          # which would read as a missing certificate rather than a missing
          # issuer. Non-fatal: on a runner that already has it, this is a no-op.
          if curl -fsSL --max-time 30 -o "$RUNNER_TEMP/wwdr.cer" \
               https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; then
            security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" \
              -T /usr/bin/codesign >/dev/null 2>&1 || true
            echo "Apple WWDR G3 intermediate installed."
          else
            echo "::warning::Could not fetch the Apple WWDR G3 intermediate; relying on what the runner already has."
          fi

          # Re-wrap the decrypted bundle into both shapes, so whichever one this
          # runner's Security framework implements is on disk to be tried. The
          # unencrypted PEM lives for these two commands on an ephemeral runner
          # and is deleted below.
          # Modern: OpenSSL 3's default export already is that shape. Falling
          # back to the system openssl means naming the algorithms explicitly.
          if [ -n "$OSSL3" ]; then
            "$OSSL3" pkcs12 -export -in "$PEM" -out "$MODERN" \
              -passout env:PW 2>/dev/null || rm -f "$MODERN"
          else
            /usr/bin/openssl pkcs12 -export -in "$PEM" -out "$MODERN" \
              -keypbe aes-256-cbc -certpbe aes-256-cbc -macalg sha256 \
              -passout env:PW 2>/dev/null || rm -f "$MODERN"
          fi

          # Legacy: the system openssl writes that shape by default, and asking
          # it costs nothing. OpenSSL 3 can only do it through the legacy
          # provider, which is not guaranteed to be loadable, so it is the
          # fallback rather than the first choice.
          /usr/bin/openssl pkcs12 -export -in "$PEM" -out "$LEGACY" \
            -passout env:PW 2>/dev/null || rm -f "$LEGACY"
          if [ ! -f "$LEGACY" ] && [ -n "$OSSL3" ]; then
            "$OSSL3" pkcs12 -export -legacy -macalg sha1 -in "$PEM" -out "$LEGACY" \
              -passout env:PW 2>/dev/null || rm -f "$LEGACY"
          fi
          for v in "$MODERN|modern" "$LEGACY|legacy"; do
            if [ -f "${v%%|*}" ]; then
              echo "Re-wrapped a ${v#*|} bundle."
            else
              echo "::warning::Could not produce a ${v#*|} bundle; it will not be among the attempts."
            fi
          done

          try_import() {
            local file="$1" label="$2"
            [ -f "$file" ] || return 1
            echo "Trying the $label bundle..."
            if security import "$file" -k "$KEYCHAIN" -P "$PW" \
                 -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 2>&1; then
              return 0
            fi
            echo "Refused."
            return 1
          }

          IMPORTED=""
          for attempt in "$P12|as supplied" \
                         "$MODERN|re-wrapped modern (AES-256-CBC, PBKDF2)" \
                         "$LEGACY|re-wrapped legacy (3DES, SHA-1 MAC)"; do
            if try_import "${attempt%%|*}" "${attempt#*|}"; then
              IMPORTED="${attempt#*|}"
              break
            fi
          done
          rm -f "$PEM" "$P12" "$MODERN" "$LEGACY" "$RUNNER_TEMP/wwdr.cer"

          if [ -z "$IMPORTED" ]; then
            echo "::error::No form of the bundle could be imported, although openssl opened it with this password. That is the Security framework refusing the ciphers, not a bad secret."
            exit 1
          fi
          echo "Imported: $IMPORTED"

          # Without this, codesign blocks on a GUI authorisation prompt that no
          # one can answer on a headless runner, and the job hangs to timeout
          # rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          echo "Signing identities now visible:"
          # Captured, then matched as a string. Piping an Objective-C tool into
          # `grep -q` closes the pipe early, and the EPIPE surfaces as an
          # uncaught NSFileHandleOperationException that kills the step under
          # pipefail. That race is what took out the toolchain step in run #2.
          IDENTITIES="$(security find-identity -v -p codesigning)"
          echo "$IDENTITIES"
          case "$IDENTITIES" in
            *"Apple Distribution"*) ;;
            *)
              echo "::error::No Apple Distribution identity in the keychain. The bundle imported, so it is a development certificate, it is missing its private key, or the issuing intermediate is absent."
              exit 1
              ;;
          esac

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_B64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::error::APPSTORE_API_PRIVATE_KEY_BASE64 / APPSTORE_API_KEY_ID are not set."
            exit 1
          fi
          # xcodebuild reads it by path; altool looks for it in this directory.
          # Written to both so neither step needs the other's convention.
          echo "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Archiving with AUTOMATIC signing asks Apple for an iOS App *Development*
      # profile. Development profiles require at least one registered device,
      # this team has none, and nobody here installs by cable, so the archive
      # died with "Your team has no devices from which to generate a
      # provisioning profile" and "No profiles for 'net.purifyapp.purify' were
      # found". Neither sentence mentions the actual constraint.
      #
      # An App Store profile carries no device list, so it sidesteps that. It is
      # minted here from the API key two steps up rather than pasted in as
      # another secret, which also means it is reissued on every run and cannot
      # drift behind the App ID's capabilities. See scripts/ios-provisioning-profile.py.
      - name: Create the App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUNDLE_ID: net.purifyapp.purify
          PROFILE_NAME: Purify App Store (CI)
          OUT_PATH: ${{ runner.temp }}/purify.mobileprovision
        run: |
          set -euo pipefail
          OUTPUT="$(python3 scripts/ios-provisioning-profile.py)"
          printf '%s\n' "$OUTPUT"
          UUID="$(printf '%s\n' "$OUTPUT" | sed -n 's/^UUID=//p')"
          NAME="$(printf '%s\n' "$OUTPUT" | sed -n 's/^NAME=//p')"
          if [ -z "$UUID" ] || [ -z "$NAME" ]; then
            echo "::error::The profile step returned no UUID or name."
            exit 1
          fi
          # Xcode looks for installed profiles by UUID filename, in this
          # directory only.
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/purify.mobileprovision" "$DEST/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Point ExportOptions at the team and the profile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID is not set (Membership details on developer.apple.com)."
            exit 1
          fi
          sed -i '' "s/__APPLE_TEAM_ID__/$TEAM_ID/" ios/ExportOptions.plist
          # The archive is signed manually against the profile above, so the
          # export has to be told the same thing. Leaving it automatic makes
          # -exportArchive go back to Apple for a profile of its own choosing,
          # which is the behaviour this whole step exists to stop.
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:net.purifyapp.purify string $PROFILE_NAME" ios/ExportOptions.plist
          plutil -p ios/ExportOptions.plist

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ -z "$REVERSED_CLIENT_ID" ]; then
            echo "::error::GOOGLE_REVERSED_CLIENT_ID is not set. Info.plist would ship an empty URL scheme and Google sign-in could not call back."
            exit 1
          fi
          # Its own counter, independent of Android's. App Store Connect only
          # requires the build number to increase within a version train.
          # RENAMING OR RECREATING THIS WORKFLOW FILE RESETS run_number, and the
          # upload is then rejected as a duplicate; the build_number input is
          # the way out of that.
          BUILD_NUMBER="${BUILD_NUMBER_INPUT:-${{ github.run_number }}}"
          echo "CFBundleVersion will be $BUILD_NUMBER"
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          # SwiftPM aborts the archive when a binary target's artifact is
          # already sitting in its shared cache:
          #
          #   failed downloading '...FBSDKCoreKit_Basics-Dynamic_XCFramework.zip'
          #   which is required by binary target 'FBSDKCoreKit_Basics':
          #   /Users/runner/Library/Caches/org.swift.swiftpm/artifacts/... already
          #   exists in file system
          #
          # Nothing is wrong with the zip or the network. The resolve simply
          # happens twice against one cache, once under `cap sync ios` above and
          # once here, and the second pass refuses to overwrite the first's work
          # instead of reusing it. (The artifact comes from
          # @capgo/capacitor-social-login, which depends on the Facebook iOS SDK
          # even though only Google and Apple sign-in are used.)
          #
          # Both the clone directory and the artifact cache are pointed at paths
          # this job owns and cleared first, so the archive resolves once from a
          # known-empty state. On an ephemeral runner that costs one download.
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" \
                 "$RUNNER_TEMP/spm" "$RUNNER_TEMP/spm-cache"

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -packageCachePath "$RUNNER_TEMP/spm-cache" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            GOOGLE_REVERSED_CLIENT_ID="$REVERSED_CLIENT_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      # An archive can be signed with the wrong entitlements and still look
      # perfectly healthy until a push silently fails to arrive in production,
      # weeks later, on a build nobody can rebuild identically. Assert instead.
      - name: Check the signed entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "::error::App.app missing from the archive."; exit 1; }
          echo "--- entitlements ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ents.txt"
          echo "--- info ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          if ! grep -q 'applesignin' "$RUNNER_TEMP/ents.txt"; then
            echo "::error::Sign in with Apple entitlement is missing. Guideline 4.8 requires it while Google sign-in is offered, and the button would fail at runtime."
            exit 1
          fi
          # Only presence is asserted here, not the value. The checked-in
          # entitlements say "development"; an archive signed against the App
          # Store profile carries "production" already. Either is fine at this
          # point, and the exported IPA is checked strictly below, which is the
          # artifact that actually reaches anyone.
          grep -q 'aps-environment' "$RUNNER_TEMP/ents.txt" || {
            echo "::error::No aps-environment entitlement; push cannot work."
            exit 1
          }

      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          # A glob, not `ls | head -1`: closing that pipe early SIGPIPEs `ls`,
          # and pipefail then fails the step for no reason. Same trap as the
          # toolchain step.
          IPA=""
          for f in "$RUNNER_TEMP"/export/*.ipa; do
            [ -f "$f" ] || continue
            IPA="$f"
            break
          done
          if [ -z "$IPA" ]; then
            echo "::error::-exportArchive produced no .ipa."
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported $(du -h "$IPA" | cut -f1)"

      # Confirms the export produced a PRODUCTION push entitlement. A build that
      # ships "development" here registers tokens against sandbox APNs, and
      # every notification to a real install disappears without an error.
      - name: Check the exported entitlements
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP=""
          for d in "$WORK"/Payload/*.app; do
            [ -d "$d" ] || continue
            APP="$d"
            break
          done
          if [ -z "$APP" ]; then
            echo "::error::No .app inside the exported IPA's Payload."
            exit 1
          fi
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ents-export.txt"
          # Captured rather than piped into `grep -q`, which would SIGPIPE the
          # first grep and fail the step under pipefail.
          APS="$(grep -A1 'aps-environment' "$RUNNER_TEMP/ents-export.txt" || true)"
          case "$APS" in
            *production*) ;;
            *)
              echo "::error::The exported build carries a non-production aps-environment. Push would go to sandbox APNs and never arrive."
              exit 1
              ;;
          esac
          echo "aps-environment is production."

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Validate first: it catches the common rejections (bad icon, missing
          # usage string, duplicate build number) in seconds, where the upload
          # would spend minutes transferring before saying the same thing.
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded. TestFlight processing usually takes 5 to 15 minutes."

      # Also published as a release asset, mirroring the Android job, so the
      # exact artifact that went to Apple can be re-downloaded and inspected.
      - name: Publish to the ios-release release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-release
          name: Purify iOS (signed)
          prerelease: true
          body: >
            Signed iOS build of Purify, local-first (the same bundle the Android
            app ships). Uploaded to App Store Connect for TestFlight when the
            workflow's upload input is checked. Replaced on every run. The
            CFBundleVersion is the workflow run number; set it in
            lib/appUpdate/release.ts only AFTER the build is live.
          files: ${{ env.IPA_PATH }}
          fail_on_unmatched_files: true

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/purify-signing.keychain-db" || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP/AuthKey.p8" || true
