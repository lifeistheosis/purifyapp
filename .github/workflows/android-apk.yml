name: Android build

# On-demand Android build. Produces, and publishes to the android-release
# GitHub release (private repo):
#   - app-release.aab  : the signed Play Store upload (cannot be sideloaded)
#   - app-release.apk  : the signed release build, installable for testing
#   - app-debug.apk    : the debug build, installable for quick testing
#
# The release builds are signed with the upload key supplied via repo
# secrets (ANDROID_KEYSTORE_BASE64 + passwords); no keystore is committed.
# The app is a thin Capacitor shell that loads purifyapp.net. Trigger from
# the Actions tab (Run workflow).
on:
  workflow_dispatch:
    inputs:
      local_first:
        description: "Bundle the local-first offline build (out/). Uncheck to build the remote-wrapper AAB that loads purifyapp.net."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Capacitor 8's android library compiles to Java 21.
          distribution: temurin
          java-version: "21"
          # Cache ~/.gradle (deps + wrapper) keyed on the gradle files, so
          # repeat builds skip re-downloading the toolchain — roughly halves
          # the build time.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-install SDK platform (best effort)
        run: yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true

      # Local-first: build the static export (out/) + bundle the content package.
      # Skipped for the legacy remote-wrapper build. The NEXT_PUBLIC_* values are
      # public (they're already baked into the deployed web bundle) and must be
      # present at build time so the exported app can do sign-in / sync / billing.
      # Add them as repo secrets (Settings > Secrets and variables > Actions).
      # If any are missing the build still succeeds (lib/supabase/server falls
      # back to a placeholder); those features just stay inert until real keys ship.
      - name: Build local-first web bundle
        if: ${{ inputs.local_first }}
        run: npm run build:android
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PLUS_ENFORCED_NATIVE: ${{ secrets.NEXT_PUBLIC_PLUS_ENFORCED_NATIVE }}
          # NEXT_PUBLIC_VAPID_KEY and NEXT_PUBLIC_API_BIBLE_KEY used to be here.
          # Both look like they belong and neither reaches anything:
          #   - VAPID is read only by lib/push/client.ts, the Web Push path.
          #     lib/push/reminders.ts branches on isNativeClient() and sends the
          #     native shells to APNs/FCM, so that path is unreachable here.
          #   - API_BIBLE_KEY is read only by app/api/admin/health, and
          #     scripts/native-build.mjs stashes app/api out of the export.
          # Both still matter on the website, where they are Render env, not
          # Actions secrets. Listing them here only lengthened the list of
          # secrets someone thinks they have to set before a build can run.
          # Public flag, not a secret: lets shopEnabled() gates pass in the
          # bundle so Discover shows the Shop tile (which opens the website
          # in the system browser; the /shop route tree itself stays web-only).
          NEXT_PUBLIC_SHOP_ENABLED: "1"
          # Prayer Campaigns. Read from a secret rather than hardcoded to "1"
          # like the shop above, because the feature depends on migrations the
          # owner applies by hand: an unset secret keeps /campaigns on its
          # "coming soon" shell in the AAB, which is the safe default. Set it
          # to 1 once 20260713_prayer_campaigns.sql, its duration follow-up,
          # and 20260725_prayer_campaign_image.sql are applied in Supabase.
          # Until then a device walk of campaigns shows the placeholder.
          NEXT_PUBLIC_CAMPAIGNS_ENABLED: ${{ secrets.NEXT_PUBLIC_CAMPAIGNS_ENABLED }}
          # Community Conversations. Hardcoded like SHOP_ENABLED above rather
          # than read from a secret, because 20260722_community.sql is verified
          # applied in production (community_posts and community_post_replies
          # both answer 200, both public_read policies live). Without this line
          # the AAB ships Conversations dark forever even after Render is
          # fixed, because NEXT_PUBLIC_* is inlined at build time.
          NEXT_PUBLIC_COMMUNITY_ENABLED: "1"
          # EIKON Box. Read by lib/eikonBox/flags.ts, and until now passed by no
          # workflow at all, so setting the Actions secret did nothing to the
          # bundle and the feature would have stayed dark in every build no
          # matter what the secrets page said. Same secret-gated shape as
          # campaigns above: unset keeps it dark, which is the safe default.
          NEXT_PUBLIC_EIKON_BOX_ENABLED: ${{ secrets.NEXT_PUBLIC_EIKON_BOX_ENABLED }}

      # CAP_LOCAL=1 makes capacitor.config.ts use webDir=out (bundled UI) instead
      # of the remote server.url. Empty (remote-wrapper) keeps loading purifyapp.net.
      - name: Sync Capacitor into the Android project
        run: npx cap sync android
        env:
          CAP_LOCAL: ${{ inputs.local_first && '1' || '' }}

      # FCM config for @capacitor/push-notifications. Without this file the
      # google-services Gradle plugin stays off and PushNotifications.register()
      # hits an uninitialized FirebaseApp and crashes the app. Injected from a
      # secret (base64) so the file is never committed. Optional: a build with
      # no secret still works, just without working push.
      - name: Decode google-services.json (FCM)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — building without FCM (push notifications won't work)."
          else
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            echo "Wrote android/app/google-services.json"
          fi

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add the upload keystore secrets first."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed release (AAB + APK) and debug APK
        working-directory: android
        env:
          # Auto-incrementing versionCode (build.gradle reads this); the run
          # number only ever goes up, so no manual bumps and no duplicate-code
          # rejections from Play.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # ONE artifact per --no-daemon invocation. Packaging holds the full
          # dex/resource/asset graph in the 4g JVM, and the bundled web assets
          # keep growing (the baked patristic commentary added ~25MB in Beta
          # 1.9.1); building the AAB and the release APK together died at
          # signReleaseBundle with "the operation was canceled" (the runner
          # killing the starved step). Sequential invocations reuse the compiled
          # release outputs from the first pass, so the extra passes only re-run
          # packaging. Do NOT merge these back into fewer lines.
          ./gradlew bundleRelease --stacktrace --no-daemon
          ./gradlew assembleRelease --stacktrace --no-daemon
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Published as release assets (private repo): raw downloads, separate
      # storage from the Actions artifact quota.
      - name: Publish to the android-release release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release
          name: Purify Android (release)
          prerelease: true
          body: >
            Signed release build of the Purify Android shell. app-release.aab
            is the Play Store upload (cannot be sideloaded). app-release.apk
            and app-debug.apk are installable on a device for testing.
            Replaced on every workflow run.
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
