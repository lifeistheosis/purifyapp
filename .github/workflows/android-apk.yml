name: Android build

# On-demand Android build. Produces, and publishes to the android-release
# GitHub release (private repo):
#   - app-release.aab  : the signed Play Store upload (cannot be sideloaded)
#   - app-release.apk  : the signed release build, installable for testing
#   - app-debug.apk    : the debug build, installable for quick testing
#
# The release builds are signed with the upload key supplied via repo
# secrets (ANDROID_KEYSTORE_BASE64 + passwords); no keystore is committed.
# The app is a thin Capacitor shell that loads purifyapp.net. Trigger from
# the Actions tab (Run workflow).
on:
  workflow_dispatch:
    inputs:
      local_first:
        description: "Bundle the local-first offline build (out/). Uncheck to build the remote-wrapper AAB that loads purifyapp.net."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Capacitor 8's android library compiles to Java 21.
          distribution: temurin
          java-version: "21"
          # Cache ~/.gradle (deps + wrapper) keyed on the gradle files, so
          # repeat builds skip re-downloading the toolchain — roughly halves
          # the build time.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-install SDK platform (best effort)
        run: yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true

      # Local-first: build the static export (out/) + bundle the content package.
      # Skipped for the legacy remote-wrapper build.
      - name: Build local-first web bundle
        if: ${{ inputs.local_first }}
        run: npm run build:android

      # CAP_LOCAL=1 makes capacitor.config.ts use webDir=out (bundled UI) instead
      # of the remote server.url. Empty (remote-wrapper) keeps loading purifyapp.net.
      - name: Sync Capacitor into the Android project
        run: npx cap sync android
        env:
          CAP_LOCAL: ${{ inputs.local_first && '1' || '' }}

      # FCM config for @capacitor/push-notifications. Without this file the
      # google-services Gradle plugin stays off and PushNotifications.register()
      # hits an uninitialized FirebaseApp and crashes the app. Injected from a
      # secret (base64) so the file is never committed. Optional: a build with
      # no secret still works, just without working push.
      - name: Decode google-services.json (FCM)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — building without FCM (push notifications won't work)."
          else
            echo "$GS_B64" | base64 -d > android/app/google-services.json
            echo "Wrote android/app/google-services.json"
          fi

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add the upload keystore secrets first."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed release (AAB + APK) and debug APK
        working-directory: android
        env:
          # Auto-incrementing versionCode (build.gradle reads this); the run
          # number only ever goes up, so no manual bumps and no duplicate-code
          # rejections from Play.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      # Published as release assets (private repo): raw downloads, separate
      # storage from the Actions artifact quota.
      - name: Publish to the android-release release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release
          name: Purify Android (release)
          prerelease: true
          body: >
            Signed release build of the Purify Android shell. app-release.aab
            is the Play Store upload (cannot be sideloaded). app-release.apk
            and app-debug.apk are installable on a device for testing.
            Replaced on every workflow run.
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
