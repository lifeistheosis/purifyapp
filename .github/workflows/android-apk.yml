name: Android APK (debug)

# On-demand debug APK for on-device testing. The Android app is a thin
# Capacitor shell that loads https://purifyapp.net, so this syncs the
# Capacitor config into the native project and assembles a debug build.
# The APK is uploaded as a downloadable artifact. It is debug-signed (the
# auto-generated debug keystore), for sideloading and testing only, NOT
# for the Play Store. Trigger it from the Actions tab (Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Capacitor 8's android library compiles to Java 21.
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-install SDK platform (best effort)
        run: yes | sdkmanager "platforms;android-36" >/dev/null 2>&1 || true

      - name: Sync Capacitor into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Published as a release asset (private repo) rather than an Actions
      # artifact, so it downloads as a raw .apk (no zip to unwrap on a
      # phone) and does not consume the Actions artifact storage quota.
      - name: Publish APK to the android-debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Purify Android (debug)
          prerelease: true
          body: >
            Debug-signed Purify shell for on-device testing. Sideload only,
            not for the Play Store. The shell loads purifyapp.net. Replaced
            on every workflow run.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
