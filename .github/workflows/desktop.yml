name: Desktop build

# Manual only, like the Android and iOS builds. Each run is billed, and the
# owner has asked for nothing to fire on push (see ci.yml's header). Run it
# from the Actions tab when a desktop build is wanted.
#
# What it makes: unsigned installers for Windows (NSIS .exe), macOS (.dmg,
# universal) and Linux (.AppImage, .deb), as workflow artifacts. Unsigned
# means Windows SmartScreen and macOS Gatekeeper will warn on first launch.
# Fine for testing; not for public release. Signing and notarisation need the
# owner's certificates as repository secrets first (docs/DESKTOP.md, "Before a
# public release"), and this workflow does not pretend to have them.
#
# Discord: the application id comes from the repository VARIABLE
# PURIFY_DISCORD_CLIENT_ID (Settings > Secrets and variables > Actions >
# Variables). It is public, not a secret. Without it the build works and the
# Settings section says Discord status is not set up in this build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Linux webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Unit tests (presence validation, Discord IPC, navigation rules)
        run: cargo test --locked
      - name: Clippy, warnings as errors
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: test
    # One platform per job, and none depends on another finishing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      PURIFY_DISCORD_CLIENT_ID: ${{ vars.PURIFY_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Linux webview
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install the Tauri CLI (desktop/package.json only, never the website's)
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build the installers
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: purify-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
