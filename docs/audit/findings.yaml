    status: reopened-corrected-unverified   # REOPENED 2026-07-18: owner reported the same button freezing the screen again, so the 07-12 Back-path fix did not resolve it (or the device predates it — the AAB for Beta 2.2 had not been cut). Second pass found a SEPARATE defect the first pass missed, in the Sheet primitive rather than the Back path: every overlay saved/restored document.body.style.overflow itself, which is correct for one overlay and broken for two, and the Bible reader mounts four (settings, chapter picker, commentary, search). Interleaving any two strands overflow:hidden with nothing open (A saves "", B saves "hidden", A restores "", B restores "hidden") and the page cannot scroll until reload — which reads exactly as "the screen froze". Sheet's 220ms exit animation keeps a closing sheet mounted, so "close one, open the other" is enough to trigger it. Fixed with a counted lock in lib/ui/overlay.ts, all nine call sites converted (a single unconverted site re-breaks every other overlay), plus a guard so an unbalanced unlock at depth 0 cannot write a stale value (StrictMode double-invokes cleanups). 5 unit tests pin the semantics; the interleave was also driven live in a browser (Filters sheet + cart drawer) ending unlocked and scrollable. Original 07-12 Back fix remains in place and unverified on-device. Residual: owner installs an AAB containing BOTH fixes and confirms on-device. Do NOT close this without a device check; it has now been reported twice.
