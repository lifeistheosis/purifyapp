  - id: F-23
    title: Job shipped 11,125 replacement characters, from one charset default at fetch time
    area: editorial/ingest
    severity: P2
    confidence: confirmed
    status: corrected-verified
    status_notes: >-
      2026-08-19. 795 of the 920 Job notes carried U+FFFD, so a reader met "by
      ?the seven sons? is represented" throughout the largest work in the library,
      and Job is one of only two Old Testament books that can ever carry
      public-domain patristic commentary. Cause, probed rather than inferred:
      lectionarycentral.com serves the Moralia pages as `Content-Type: text/html`
      with NO charset, while the documents declare windows-1252 in a meta tag in
      the head. fetch()'s res.text() reads only the header, defaults to UTF-8, and
      every cp1252 smart quote and section sign became U+FFFD before the parser
      ever saw it. The result was then cached, so the original bytes were gone and
      no local repair was possible. Fix: decodeDeclared() sniffs the charset out
      of the document and decodes deliberately; the 35 poisoned cache files were
      deleted and refetched. Proof: 920 notes before and after with identical
      keys, one author, 35 Book strings, one citation; 124 byte-identical, 795
      differing in punctuation and encoding alone, and exactly two word-level
      changes, both being fused words (intoEgypt, confoundthem) coming apart
      because the same pass stopped DELETING numeric entities and started decoding
      them. U+FFFD 11,125 to 0.
    evidence: scripts/ingest-gregory-job.mjs decodeDeclared(); commit "Give Gregory back his quotation marks"
    action: "done. The general rule is now in docs/editorial-standards.md: fetch() obeys the Content-Type header and never reads the document, so a source that declares its encoding only in the markup must be decoded explicitly."
    safe_to_automate: true
    review: none

