  - id: F-13
    title: "'We couldn't confirm your sign-in' after a successful login — gate did a network getUser() that races/fails"
    area: reliability/web
    severity: P1
    confidence: high
    status: corrected-unverified
    status_notes: >-
      2026-07-12 SIXTH pass: owner clue "first login works, but refresh /
      click-out-then-in => infinite loading on Profile + Security" = the SIGNATURE
      of a client auth call (getUser network-validate, or getSession refreshing an
      aged token) STALLING on re-navigation with no timeout. Root remedy: stop
      asking the network at all. lib/supabase/localSession.readLocalSessionUser()
      reads the signed-in user straight from the persisted sb-<ref>-auth-token
      cookie/localStorage (chunked, base64url) — synchronous, no network, no
      refresh, no lock, cannot hang. The server proxy keeps that cookie fresh on
      every request. Wired as the FAST PATH in resolveUser (shop + native gate)
      and directly into ProfileTabClient + SecurityTabClient, which now RENDER
      FROM THE SESSION IMMEDIATELY and let the DB row (nice display name / join
      date / has_password) enhance after — so a slow follow-up query can never
      strand the tab either. Verified: 7 localSession parser unit tests + a live
      browser parse of a real-shaped cookie; resolveUser fast-path unit test
      asserts it returns signed-in WITHOUT calling getSession; 299 unit green; tsc
      0; eslint clean; web build green. Not fully E2E-verifiable here (server
      correctly refuses account pages to a fake test session; the signed-in render
      path is deterministic-by-code). Residual: owner deploy + open
      Profile/Security after a refresh to confirm.
    #
    # -- FIFTH pass (Profile/Security getSession swap), superseded by the sync read above: -- Same root cause one layer deeper: ProfileTabClient and SecurityTabClient each awaited a network getUser() on mount and, with no error branch, stranded on their loading state forever when that call hung. Fixed both to read the LOCAL session (getSession) — the server proxy already refreshed the cookie, so the signed-in identity is available with no network round-trip. Child components are safe: ProfileHero's getUser is save-only; OAuthConnectionsCard starts with an empty-identities array and renders immediately; the sync bridges return null and never block the tab. Latent same-pattern getUser() reads remain in background/display components (avatars, greetings, sync bridges) — non-blocking, tracked with F-18. Still needs the owner's signed-in re-test to close.
    #
    # -- FOURTH pass (gate fix), retained: -- Owner clarified the error appears "already signed in, on open" (NOT right after login). The lock-only fix was deployed (prod SW = purify-beta-1.9.5) and the auth endpoint is healthy (~120-250ms), so neither the lock nor endpoint was it. ROOT CAUSE: on the WEB the server proxy (proxy.ts -> lib/supabase/middleware.updateSession) ALREADY validates + refreshes the session cookie and 307-redirects signed-out users off /account/* BEFORE any page renders (verified live: cookieless GET /account/security and /account/profile both 307; /account 200; /shop/orders 200 i.e. NOT server-gated). So on the web, if AccountAuthGate is rendering at all the user is authenticated — but the gate ALSO ran a redundant CLIENT getUser() (network re-validation) whose network call raced a token refresh on open and failed -> "unresolved" -> the error card for an already-signed-in user. FIX (2 parts): (1) AccountAuthGate now trusts the server gate on the web and renders without the client re-check; it runs the client resolve ONLY on native (isNativeClient(), no server proxy there). (2) resolveUser (still the gate on native + on the non-server-gated /shop/* loaders) reads the LOCAL session (getSession) instead of network getUser(), so a valid cookie/session confirms with no network round-trip. Data stays RLS-enforced server-side. VERIFIED: server 307 gate confirmed live on prod; tsc 0; eslint clean; 291 unit (6 resolveUser tests -> getSession). Residual = owner deploy + confirm the /account walk on their signed-in session (the signed-in client path still cannot be reproduced without their account).
    evidence: "live walk 2026-07-11 signed-in browser: /shop/icons/* catalog+config APIs returned 200 (extension network log) while the page never left its skeleton; sole unsettled Promise.all member was hasActivePlusClient -> supabase.auth.getUser(); no console errors (silent lock wait). Matches the earlier '/account never loads' owner report signature. Fix evidence: lib/supabase/__tests__/resolveUser.test.ts (6 passing); typecheck/lint/unit/build:android/e2e green on the combined tree."
    action: >
      done, in two layers. (1) 2026-07-11 general case: three-state resolveUser
      + retry states (above). (2) 2026-07-12 ROOT FIX after the deployed retry
      state surfaced live ("couldn't confirm your sign-in" on /account —
      a jammed lock makes Try again unwinnable): lib/supabase/resilientLock.ts
      wraps the cross-tab auth lock; on acquire timeout it runs the operation
      LOCKLESS instead of failing (worst case a redundant token refresh, vs a
      guaranteed outage). Also caps the acquire timeout supabase-js actually
      hands custom locks — observed live with locks debug on, it passes
      `undefined`, which navigatorLock treats as wait-forever. resolveUser
      deadline raised to 8s so the 5s lock timeout + lockless fallback settle
      inside it. Wired via createBrowserClient auth.lock (verified forwarded
      ssr -> supabase-js -> GoTrueClient in dist source). Reproduced and
      proven end to end; the smoke test jams the lock from another context and
      asserts the ordinary sign-in prompt renders and the retry copy does NOT
      (tests/smoke/seller-console.spec.ts, passes in 6.8s = 5s timeout +
      fallback); 5 unit tests on the wrapper incl. the undefined/-1/Infinity
      caps. Full suite 46 e2e / 283 unit green.
    safe_to_automate: partially
    review: none

