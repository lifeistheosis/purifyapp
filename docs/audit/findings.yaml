  - id: F-21
    title: Native push is inert in production — token tables absent, FCM unset, registration path broken
    area: push/native
    severity: P2
    confidence: confirmed
    status: partially-corrected   # owner report 2026-07-18 that admin push does not work for the app. Four independent gates, all shut. (1) PRIMARY, owner action: public.device_push_tokens and public.push_subscriptions DO NOT EXIST in production — probed via PostgREST, both return 404 PGRST205 while RLS-locked tables that do exist (shop_product_sourcing, shop_suppliers, entitlements) return 200 []. Migrations 20260613_device_push_tokens.sql and 20260531_push_subscriptions.sql were never applied. It fails silently because lib/push/audience.ts destructures only `data`, discarding the error, so a missing table yields zero recipients and the broadcast logs `enqueued` with no failure. (2) FIXED: lib/push/native.ts used bare relative fetch to /api/push/device, which inside the shell resolves to https://localhost where app/api is stashed out of the export — the token never left the device. Now uses apiFetch. (3) FIXED: /api/push/device authenticated with the cookie-bound client and had no CORS, so a cross-origin bearer request would 401 and the preflight would fail. Now createClientFromRequest + corsRoute + OPTIONS; verified against a dev server with Origin: https://localhost. (4) OWNER ACTION: FCM_SERVICE_ACCOUNT_JSON is unset (not even documented in .env.local.example), so fcmConfigured() is false and every native send dry-runs. Residual, in order: apply both migrations, set the FCM key on Render, cut a new AAB (the client fix ships in the bundle), enable reminders on a device to seed a token, then broadcast.
    safe_to_automate: no
    review: none
