  - id: F-21
    title: Native push is inert in production — token tables absent, FCM unset, registration path broken
    area: push/native
    severity: P2
    confidence: confirmed
    status: partially-corrected
    status_notes: >-
      owner report 2026-07-18 that admin push does not work for the app. Four
      independent gates, all shut. (1) PRIMARY, owner action:
      public.device_push_tokens and public.push_subscriptions DO NOT EXIST in
      production — probed via PostgREST, both return 404 PGRST205 while RLS-locked
      tables that do exist (shop_product_sourcing, shop_suppliers, entitlements)
      return 200 []. Migrations 20260613000000_device_push_tokens.sql and
      20260531000000_push_subscriptions.sql were never applied. It fails silently
      because lib/push/audience.ts destructures only `data`, discarding the error,
      so a missing table yields zero recipients and the broadcast logs `enqueued`
      with no failure. (2) FIXED: lib/push/native.ts used bare relative fetch to
      /api/push/device, which inside the shell resolves to https://localhost where
      app/api is stashed out of the export — the token never left the device. Now
      uses apiFetch. (3) FIXED: /api/push/device authenticated with the
      cookie-bound client and had no CORS, so a cross-origin bearer request would
      401 and the preflight would fail. Now createClientFromRequest + corsRoute +
      OPTIONS; verified against a dev server with Origin: https://localhost. (4)
      OWNER ACTION: FCM_SERVICE_ACCOUNT_JSON is unset (not even documented in
      .env.local.example), so fcmConfigured() is false and every native send
      dry-runs. Residual, in order: apply both migrations, set the FCM key on
      Render, cut a new AAB (the client fix ships in the bundle), enable reminders
      on a device to seed a token, then broadcast. CORRECTION 2026-08-22, probed
      read-only with the service role: GATE (1) IS CLOSED and this record was
      stale. public.device_push_tokens EXISTS and holds 96 registered Android
      tokens, the oldest created 2026-07-20; public.push_subscriptions EXISTS and
      is empty (web push has no VAPID keys set). Both migrations have been applied
      at some point since this finding was written. The 404 PGRST205 quoted above
      is no longer reproducible. So the count is not four gates but one:
      FCM_SERVICE_ACCOUNT_JSON on Render. It is present in the local .env.local,
      which says nothing about production, and Render env is not readable from a
      checkout, so only the owner can close it. Gates (2) and (3) were already
      fixed and the client fix is in the bundle, which is consistent with 96
      tokens having registered. Do not re-derive this from the folder: probe. The
      recipe is in AGENTS.md. SECOND CORRECTION, same day, from the Render and
      GitHub dashboards rather than from a checkout: GATE (4) IS ALSO CLOSED.
