  - id: F-37
    title: The webhook marks an order paid on a completed checkout that Stripe says is still unpaid
    area: commerce
    severity: P2
    confidence: high
    status: confirmed
    status_notes: >-
      2026-10-04, found while fixing F-33. Read from code and run in a
      throwaway test, not seen on production. checkout.session.completed
      means the buyer finished the form, not that the money arrived. For a
      card, a wallet or Link the two are the same moment and the session's
      payment_status is "paid". For a payment method that clears later, a
      bank debit for one, Stripe sends the same event with payment_status
      "unpaid", and a second event days after,
      checkout.session.async_payment_succeeded or async_payment_failed.
      settleCheckoutSession never reads payment_status, and SessionLike does
      not carry it. So the webhook marks that order paid, takes the stock
      down and sends the confirmation at the moment of the form, and nothing
      takes it back if the debit then fails. Run with a completed session
      carrying payment_status "unpaid" and a matching total: the settlement
      answered "paid" and sent one confirmation. Reconcile and the abandoned
      sweep both check, and settle only a session Stripe calls paid, so the
      webhook is the one path that does not. Dormant as far as can be seen
      from here. Checkout names no payment_method_types, so the methods on
      offer are whatever the Stripe dashboard has switched on, and that
      cannot be read without Stripe. The three orders the delivery log timed
      settled within four minutes of their checkouts opening, which a method
      that clears later does not do. It bears on F-33 too: such an order's
      paid_at would be the time of the form. Not repaired here: it changes
      which sessions settle, on the money path, and wants its own tests and
      the owner's word.
    evidence: lib/shop/webhookSettlement.ts (SessionLike, settleCheckoutSession); app/api/shop/stripe-webhook/route.ts; lib/shop/checkout.ts (sessions.create names no payment_method_types); app/api/admin/shop/reconcile/route.ts and lib/shop/abandonedCheckouts.ts, which hold the check the webhook lacks
    action: "Owner first: look at Settings, Payment methods in the Stripe dashboard. If nothing that clears later is switched on, this stays dormant. The repair either way: the settlement refuses a session whose payment_status is neither paid nor no_payment_required, the route answers 200 so Stripe does not retry, and the order stays pending. The sweep and reconcile then settle it once Stripe says paid, with the charge's time. Subscribing the endpoint to checkout.session.async_payment_succeeded and handling it would settle it at once, with that event's time."
    safe_to_automate: false
    review: requires-owner

