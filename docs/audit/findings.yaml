      lib found 114 call chains that select rows and name no limit, no range
      and no single row. Fifteen were repaired with F-31, because they sent
      something or stood behind a figure. 99 are left. That number is where
      to look and not a count of defects: a parse cannot tell a read held to
      one id, or to a short list of ids, or limited on a later line, from
      one that grows. Read so far, in the order they matter. (1)
      lib/ambassadors/payouts.ts. A payout marks every cleared commission
      row with the payout id in one update, then reads those rows back with
      no limit and pays their sum. Past 1,000 rows in one payout the sum is
      of a thousand of them and the transfer is short, while every row
      carries the payout id and reads as paid. It needs a thousand referred
      orders in one period, against four paid orders ever, so it is far off,
      and it is money. Not touched: it is a transfer path, and the owner's to
      open. (2) lib/sync/annotations.ts, lib/sync/bookmarks.ts and
      lib/sync/florilegium.ts. A reader's own notes, highlights, bookmarks
      and collections, pulled to a device on sign-in with no limit. All
      three merge by union and delete nothing, so nothing is lost on the
      server; a reader with more than a thousand gets part of them on a new
      phone, and for annotations which part is not stated. This is the one
      most likely to have happened already to somebody, and it could not be
      measured here. Not touched: it is client code that ships in the app,
      so it needs both native builds and a walk on a device. (3)
      lib/shop/payouts.ts getOrderFees, which puts every order id of a
      seller in one .in() and reads the answer in one request. (4)
      lib/email/lifecycle.ts, the lines and reviews behind a review request:
      held to 200 orders by the read before them, so short of 1,000 unless
      orders carry five lines each. (5) The catalogue lists in the admin
      shop routes, which are whole while the catalogue is under a thousand
      pieces. Two edges of the same kind that are not this cap: walkUsers in
      lib/admin/users.ts stops at 50 pages of 200, so emailsByUserId
      resolves nobody past the 10,000th account and does not say so
      (allAccounts does, with `complete`); and an .in() over a long list of
      ids carries the list in the address of the request, which has a limit
      of its own that was not measured, since production reads were refused
      to this session. pageAllIn sends such a list a hundred at a time.
      Nothing here was run against production.
      2026-10-04, later. The owner said "fix the rest". All 99 were read.
      Twenty could grow and are repaired on branch fix/row-cap-1000. The
      ambassador payout adds up every commission it claims, walking the id
      and not numbered pages, because a refund can take a row out of the set
      while it is being read and numbered pages would then skip one that
      still gets marked paid; if the claimed rows cannot be read whole it
      sends nothing, lets them go and says so. Its admin screen reads the
      ledger, the clicks and the payouts whole, since the balances shown
      there are added up from them, and the monthly run reads every
      ambassador. The three sync pulls read every note, highlight, bookmark
      and gathered passage. The slug list the app builds its product pages
      from, the admin catalogue, the store counts, a seller's fees and the
      two reads behind a review request are whole too. With the old code put
      back the payout test sends 250,000 cents where 300,000 were owed; the
      update that then marks the rows paid names no limit and is not cut, so
      all 1,200 would have read as paid. The other
      80 are left on purpose: 34 are lists a person keeps by hand or that
      grow by one row a day, a month or a release (goals, patch notes, the
      board, expense lines, drops, stores, sellers); 31 are held to a short
      list of ids from a page that has its own limit, or to one order or one
      post; 7 are one reader's own rows of a kind that stays small; 6 are
      limited or made single on a later line, which a parse cannot see; one
      is an hour of paid orders; and one reads a column nothing writes.
      Corrected-unverified until it is deployed, and for the sync pulls
      until an app build carries it.
