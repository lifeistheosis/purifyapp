[package]
name = "purify-desktop"
version = "1.4.0"
description = "Purify for Windows, macOS and Linux"
authors = ["Purify"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "purify_desktop_lib"
# rlib only. Tauri's template adds "staticlib" and "cdylib" for Tauri's own
# iOS and Android targets, which this project does not have: Purify's phone
# apps are Capacitor, and there is no gen/android or gen/apple here. The
# desktop program links the rlib and nothing else. The cdylib was not just
# unused but fatal on Windows with the GNU toolchain: exported as a DLL, the
# library carries more than 65,535 symbols and GNU ld stops with "export
# ordinal too large" (found 2026-09-25 building on Windows). Put the two back
# only if Tauri mobile is ever added.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-deep-link = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
