[package]
name = "purify-desktop"
version = "1.4.0"
description = "Purify for Windows, macOS and Linux"
authors = ["Purify"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "purify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-deep-link = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
