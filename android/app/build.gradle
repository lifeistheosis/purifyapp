apply plugin: 'com.android.application'

android {
    namespace = "net.purifyapp.purify"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.purifyapp.purify"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets ANDROID_VERSION_CODE from the workflow run number so every
        // build is automatically higher than the last (no manual bumps, no
        // "duplicate versionCode" rejections). Local builds use the literal
        // fallback. Keep the fallback ahead of the last manual upload (4).
        // Property assignment (not `versionCode (...)`) so `.toInteger()` binds
        // to the string, not to versionCode()'s return — the latter parsed as
        // `versionCode("N").toInteger()` and failed with "Value is null".
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "4").toInteger()
        versionName = "1.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing. Driven entirely by environment variables so no
    // keystore or password is ever committed. Active only when
    // ANDROID_KEYSTORE_FILE is provided (CI, from GitHub secrets); local
    // and debug builds are unaffected and need no keystore.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8: remove the Java and Kotlin code nothing reaches, tighten
            // what is left, and rename it.
            //
            // Play asked for it on 2026-10-04: "DEX code optimization is
            // below our threshold. Obfuscation (3%)", and under 25% in a
            // category "may impact your visibility and publishing
            // capabilities". Nothing in this build was being renamed or
            // removed. The 3% is most likely what the libraries had already
            // renamed before they reached us.
            //
            // What R8 must leave alone is in proguard-rules.pro, each with
            // its reason. A rule that is missing does not fail the build. It
            // fails on a phone, the first time renamed code is looked up by
            // its old name. So a release APK is opened on a device whenever
            // that file, a Capacitor plugin or a native dependency changes
            // (docs/RELEASE.md, "The Android app is shrunk").
            //
            // The -optimize default file: proguard-android.txt carries
            // -dontoptimize, and AGP 9 no longer ships it.
            minifyEnabled true
            // Resources are left alone on purpose. Capacitor and the splash
            // screen find some of theirs by name (getIdentifier), which a
            // resource shrinker cannot follow, and they are a sliver of an
            // app whose weight is the bundled site. Play's measure is of the
            // code, and does not ask for this.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Bundle native debug symbols (from Capacitor / RevenueCat .so
            // libraries) into the AAB so Play can symbolicate native crashes
            // and ANRs. Clears Play's "no debug symbols uploaded" warning.
            // Symbols are stored by Play, not shipped to devices, so the
            // delivered app size is unaffected.
            ndk {
                debugSymbolLevel 'FULL'
            }
            // Sign with the release key only when it has been supplied; an
            // unsigned release is left for environments without the keystore.
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // EdgeToEdge.enable() in MainActivity (for @capacitor-community/safe-area).
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
